dirs:
  - .
useGitIgnore: true
excludedDirs:
  # These files are Publisher inputs whose links resolve only after FHIR artifacts are generated.
  # The Publisher checks the rendered guides and reports broken links as build failures.
  - mobile/input/pagecontent
  - healthkit/input/pagecontent
ignorePatterns:
  - pattern: '^doc:.*$'
  - pattern: '^http://localhost.*$'
  # These routes are introduced by this pull request and are verified in the assembled
  # Pages artifact. They become live when the change is deployed from the default branch.
  - pattern: '^https://schmiedmayerlab\.github\.io/grove-fhir/(fhir/(mobile|healthkit)|healthkit)(/.*)?$'
replacementPatterns:
  - pattern: '(.*)#gh-dark-mode-only'
    replacement: '$1'
  - pattern: '(.*)#gh-light-mode-only'
    replacement: '$1'
