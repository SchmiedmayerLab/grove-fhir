name: Development Preview

on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
    branches: [main]

concurrency:
  group: development-preview
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy development preview
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Ignore a completed build superseded on main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          echo "matches=$([[ "$current" == "$BUILT_REVISION" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Locate the unique verified Pages artifact
        if: steps.current.outputs.matches == 'true'
        id: artifact
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              },
            );
            const matches = artifacts.filter(
              (artifact) => artifact.name === "pages-site" && !artifact.expired,
            );
            if (matches.length > 1) {
              core.setFailed("Build and Test produced multiple pages-site artifacts");
              return;
            }
            if (matches.length === 0) {
              core.setFailed("A successful main build must contain its verified pages-site artifact");
              return;
            }
            const downloads = artifacts.filter(
              (artifact) => artifact.name === "fhir-bulk-downloads" && !artifact.expired,
            );
            if (downloads.length !== 1) {
              core.setFailed("The preview must have its matching fhir-bulk-downloads artifact");
              return;
            }
            core.setOutput("present", "true");
      - uses: actions/download-artifact@v8
        if: steps.artifact.outputs.present == 'true'
        with:
          name: pages-site
          path: .build/pages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify the downloaded build-once site
        if: steps.artifact.outputs.present == 'true'
        run: >-
          python3 Scripts/check-publication.py
          --site .build/pages
          --repository-root .
          --config publication/config.json
          --base-url https://schmiedmayerlab.github.io/grove-fhir
      - name: Report the GitHub Pages site size
        if: steps.artifact.outputs.present == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          size = sum(path.stat().st_size for path in Path('.build/pages').rglob('*') if path.is_file())
          print(f"Assembled preview: {size:,} bytes")
          if size > 1_000_000_000:
              print("::warning::Preview exceeds GitHub Pages' supported 1 GB size. Larger deployments can succeed but are not guaranteed; monitor deployment time and reduce duplicate output. See PUBLICATION.md.")
          PY
      - name: Upload the already verified Pages artifact
        if: steps.artifact.outputs.present == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/pages
          include-hidden-files: true
      - name: Deploy documentation
        if: steps.artifact.outputs.present == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the deployed preview
        if: steps.artifact.outputs.present == 'true'
        run: >-
          python3 Scripts/check-live-publication.py
          --base-url "${{ steps.deployment.outputs.page_url }}"
          --expected-revision "${{ github.event.workflow_run.head_sha }}"
      - name: Report a truthful deployment skip
        if: steps.current.outputs.matches != 'true'
        run: echo "A newer revision is on main; this older preview was not deployed."
