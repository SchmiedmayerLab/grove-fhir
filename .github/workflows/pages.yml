name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check out immutable publications
        uses: actions/checkout@v7
        with:
          ref: publication
          path: .published
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.fhir
            .build/fhir-tools
            .build/bundle
            mobile/input-cache
            healthkit/input-cache
            health-connect/input-cache
          key: fhir-pages-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'package-lock.json', 'Scripts/download-fhir-tools.sh') }}
          restore-keys: |
            fhir-pages-${{ runner.os }}-
      - run: npm ci
      - name: Verify documentation and publication sources
        run: npm test
      - name: Build the documentation site
        env:
          PUBLISHED_SITE_ROOT: ${{ github.workspace }}/.published
        run: npm run pages:build
      - name: Verify the assembled package artifact allowlist
        run: python3 -m unittest Tests.test_artifact_allowlist -v
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/pages

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the deployed preview
        run: >-
          python3 Scripts/check-live-publication.py
          --base-url "${{ steps.deployment.outputs.page_url }}"
          --expected-revision "${{ github.sha }}"
      - name: Verify the canonical host
        if: vars.FHIR_CANONICAL_BASE_URL != ''
        run: >-
          python3 Scripts/check-live-publication.py
          --base-url "${{ vars.FHIR_CANONICAL_BASE_URL }}"
          --expected-revision "${{ github.sha }}"
          --canonical-only
