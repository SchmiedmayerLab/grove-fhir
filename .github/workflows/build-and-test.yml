name: Build and Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling:
    name: Repository and Tooling Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run repository and tooling tests
        run: npm test
      - name: Reject whitespace errors
        run: git diff --check

  guides:
    name: Build All Implementation Guides
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.fhir
            .build/fhir-tools
            .build/bundle
            archive/v0-healthkit-shaped/input-cache
            ig/input-cache
            platforms/input-cache
          key: fhir-guides-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'package-lock.json', 'Scripts/download-fhir-tools.sh') }}
          restore-keys: |
            fhir-guides-${{ runner.os }}-
      - run: npm ci
      - name: Build archived, platform, and core guides
        run: npm run build
      - name: Summarize publisher QA
        if: always()
        run: python3 Scripts/check-guide-qa.py --summary archive/v0-healthkit-shaped platforms ig
      - name: Upload rendered guides and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-guides
          if-no-files-found: error
          retention-days: 14
          path: |
            archive/v0-healthkit-shaped/output
            platforms/output
            ig/output

  vocabulary-is-current:
    name: Platform Vocabulary Matches Grove
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: grove-fhir
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.GROVE_REPOSITORY || 'SchmiedmayerLab/Grove' }}
          ref: ${{ vars.GROVE_REF || 'main' }}
          path: grove
      - name: Dump the vocabulary Grove writes
        working-directory: grove
        run: ./Scripts/run-package-tests.sh GroveHealthKitFHIR macOS
      - name: Regenerate the platform vocabulary
        working-directory: grove-fhir
        run: |
          python3 tools/generate-platform-vocabulary.py \
            --grove ../grove --dump ../grove/.build/grove-vocabulary.json
      - name: Reject vocabulary drift
        working-directory: grove-fhir
        run: git diff --exit-code -- platforms/input

  emitted-resource-conformance:
    name: Grove Output Conforms to the Guides
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          path: grove-fhir
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.GROVE_REPOSITORY || 'SchmiedmayerLab/Grove' }}
          ref: ${{ vars.GROVE_REF || 'main' }}
          path: grove
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grove-fhir/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - name: Install and build both active guide packages
        working-directory: grove-fhir
        run: |
          npm ci
          ./Scripts/build-guides.sh platforms ig
      - name: Validate resources emitted by Grove
        working-directory: grove
        env:
          FHIR_VALIDATOR: ${{ github.workspace }}/grove-fhir/.build/fhir-tools/validator_cli.jar
        run: |
          export GROVE_IG_CORE="$HOME/.fhir/packages/org.grovealliance.fhir.core#0.5.0"
          export GROVE_IG_PLATFORMS="$HOME/.fhir/packages/org.grovealliance.fhir.platforms#0.1.0"
          ./Scripts/validate-fhir-conformance.sh
      - name: Upload emitted fixtures and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grove-conformance-fixtures
          if-no-files-found: warn
          retention-days: 14
          path: grove/.build/conformance-fixtures
