name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  tooling:
    name: Repository and Tooling Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - run: npm ci
      - run: npm test
      - run: npm run producer-kit:check
      - name: Prohibit reverse implementation execution
        run: |
          if test -e .gitmodules || test -e Integration; then
            exit 1
          fi
          if git ls-files -s | grep '^160000 '; then
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'git submodule' .github Scripts Conformance README.md; then
            exit 1
          fi
      - run: git diff --check

  draft-guides:
    name: "Draft: Build Changed R4 Guides"
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    needs: tooling
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.10+7.0.LTS"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: false
      - name: Select the locked Bundler
        run: gem install bundler -v 4.0.16 --no-document
      - uses: actions/cache@v5
        with:
          path: |
            .build/fhir-home
            .build/fhir-tools
            .build/bundle
          key: fhir-guides-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'package-lock.json', 'Scripts/download-fhir-tools.sh') }}
          restore-keys: |
            fhir-guides-${{ runner.os }}-
      - run: npm ci
      - name: Select dependency-closed changed guides
        id: scope
        run: >-
          python3 Scripts/select-draft-guides.py
          --base '${{ github.event.pull_request.base.sha }}'
          --head '${{ github.event.pull_request.head.sha }}'
          >> "$GITHUB_OUTPUT"
      - name: Build changed guides
        if: steps.scope.outputs.guides != ''
        run: ./Scripts/build-guides.sh ${{ steps.scope.outputs.guides }}
      - name: Report tooling-only draft
        if: steps.scope.outputs.guides == ''
        run: echo 'No guide inputs or package dependencies changed.'

  guides:
    name: Build and Validate All R4 Guides
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: tooling
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.10+7.0.LTS"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: false
      - name: Select the locked Bundler
        run: gem install bundler -v 4.0.16 --no-document
      - uses: actions/cache@v5
        with:
          path: |
            .build/fhir-home
            .build/fhir-tools
            .build/bundle
          key: fhir-guides-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'package-lock.json', 'Scripts/download-fhir-tools.sh') }}
          restore-keys: |
            fhir-guides-${{ runner.os }}-
      - run: npm ci
      - run: npm run pages:build
      - run: python3 -m unittest Tests.test_artifact_allowlist -v
      - run: python3 Scripts/validate-questionnaire-fhir.py
      - name: Validate the example producer with the official Validator
        run: >-
          python3 Scripts/validate-producer.py
          --manifest Conformance/example-producer/manifest.json
          --validator .build/fhir-tools/validator_cli.jar
          --package mobile=mobile/output/package.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: pages-site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: .build/pages
