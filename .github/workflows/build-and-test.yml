name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  tooling:
    name: Repository and Tooling Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - run: npm ci
      - run: npm test
      - run: npm run producer-kit:check
      - name: Verify the pinned tool assets still match upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./Scripts/check-tool-pins.sh
      - name: Prohibit reverse implementation execution
        run: |
          if test -e .gitmodules || test -e Integration; then
            exit 1
          fi
          if git ls-files -s | grep '^160000 '; then
            exit 1
          fi
          if grep -REn 'git[[:space:]]+submodule' .github Scripts Conformance README.md; then
            exit 1
          fi
      - run: git diff --check

  inventory-paths:
    name: Detect inventory-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: filter
        run: |
          git fetch --quiet --depth 1 origin "${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- \
              'catalog/*-adapter.json' '*/input/data/*-inventory.json' \
              Scripts/platform_inventory.py Scripts/apple-identifier-dump.m \
              Scripts/render-platform-inventories.py | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  platform-inventory:
    name: Regenerate Adapter Inventories From the Platforms
    # The other jobs only prove each catalog matches the evidence committed beside it.
    # This one re-reads the platforms, so a symbol written into both files is still
    # caught. HealthKit and SensorKit identifiers are read from a running simulator,
    # which is why this lane is macOS. It runs only when its inputs can have changed;
    # pushes to main always run it.
    needs: inventory-paths
    # `!cancelled()` rather than `always()`: it still runs when inventory-paths is skipped on a
    # push, but a superseded run no longer keeps this job alive and holds up the run after it.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.inventory-paths.outputs.changed == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      # The identifiers are read from the SDK the catalogs are frozen on, so select that
      # Xcode when the runner has it. If it does not, the check reports that it cannot
      # verify rather than reporting a vendor change that did not happen.
      - name: Select the Xcode the catalogs are frozen on
        run: |
          version=$(python3 -c 'import json; print(json.load(open("catalog/healthkit-adapter.json"))["source"]["sdkBaseline"]["xcodeVersion"])')
          if [ -d "/Applications/Xcode_${version}.app" ]; then
            sudo xcode-select --switch "/Applications/Xcode_${version}.app/Contents/Developer"
          else
            echo "::warning::Xcode ${version} is not installed; available: $(find /Applications -maxdepth 1 -name 'Xcode*.app' | tr '\n' ' ')"
          fi
          xcodebuild -version
      # Exit 2 means the recorded Xcode is unavailable on this image, so the platforms cannot
      # be re-read here; that is "cannot verify", not drift, and must not fail the pull request.
      - name: Check the inventories against the running platforms
        run: |
          set +e
          python3 Scripts/render-platform-inventories.py --check
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::The recorded Xcode is unavailable on this runner image; platform inventories were not re-verified."
            exit 0
          fi
          exit "$status"

  draft-guides:
    name: "Draft: Build Changed R4 Guides"
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.10+7.0.LTS"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: false
      - name: Select the locked Bundler
        run: gem install bundler -v 4.0.16 --no-document
      - uses: actions/cache@v6
        with:
          path: |
            .build/fhir-home
            .build/fhir-tools
            .build/bundle
          key: fhir-guides-${{ runner.os }}-${{ hashFiles('Scripts/download-fhir-tools.sh') }}-${{ hashFiles('Gemfile.lock', 'package-lock.json') }}
          restore-keys: |
            fhir-guides-${{ runner.os }}-${{ hashFiles('Scripts/download-fhir-tools.sh') }}-
      - run: npm ci
      - name: Select dependency-closed changed guides
        id: scope
        run: >-
          python3 Scripts/select-draft-guides.py
          --base '${{ github.event.pull_request.base.sha }}'
          --head '${{ github.event.pull_request.head.sha }}'
          >> "$GITHUB_OUTPUT"
      - name: Build changed guides
        if: steps.scope.outputs.guides != ''
        run: ./Scripts/build-guides.sh ${{ steps.scope.outputs.guides }}
      - name: Report tooling-only draft
        if: steps.scope.outputs.guides == ''
        run: echo 'No guide inputs or package dependencies changed.'

  guide-plan:
    name: Plan the Guide Build Waves
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trunk1: ${{ steps.plan.outputs.trunk1 }}
      trunk2: ${{ steps.plan.outputs.trunk2 }}
      trunk3: ${{ steps.plan.outputs.trunk3 }}
      trunk4: ${{ steps.plan.outputs.trunk4 }}
      trunk5: ${{ steps.plan.outputs.trunk5 }}
      leaf1: ${{ steps.plan.outputs.leaf1 }}
      leaf2: ${{ steps.plan.outputs.leaf2 }}
      leaf3: ${{ steps.plan.outputs.leaf3 }}
      leaf4: ${{ steps.plan.outputs.leaf4 }}
      leaf5: ${{ steps.plan.outputs.leaf5 }}
      leaf6: ${{ steps.plan.outputs.leaf6 }}
      built1: ${{ steps.plan.outputs.built1 }}
      built2: ${{ steps.plan.outputs.built2 }}
      built3: ${{ steps.plan.outputs.built3 }}
      built4: ${{ steps.plan.outputs.built4 }}
      built5: ${{ steps.plan.outputs.built5 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      # The waves come from each guide's own dependencies, so adding a guide needs no edit here.
      # Each wave is split into its trunk (guides another guide depends on) and its leaves. Only
      # the trunk gates the next wave, so a slow leaf such as healthkit no longer holds back
      # guides that never read it. `builtN` is the trunk of waves 1 to N, which wave N+1 restores.
      # 6 is the number of wave levels the jobs below provide; a deeper plan fails loudly.
      - id: plan
        run: python3 Scripts/guide-build-plan.py --ci-outputs 6 >> "$GITHUB_OUTPUT"

  guide-trunk-1:
    name: Guides
    needs: guide-plan
    uses: ./.github/workflows/build-guide-wave.yml
    with:
      guides: ${{ needs.guide-plan.outputs.trunk1 }}
      built: "[]"
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      upload-package: true

  guide-leaf-1:
    name: Guides
    needs: guide-plan
    uses: ./.github/workflows/build-guide-wave.yml
    with:
      guides: ${{ needs.guide-plan.outputs.leaf1 }}
      built: "[]"
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  guide-trunk-2:
    name: Guides
    needs: [guide-plan, guide-trunk-1]
    uses: ./.github/workflows/build-guide-wave.yml
    with:
      guides: ${{ needs.guide-plan.outputs.trunk2 }}
      built: ${{ needs.guide-plan.outputs.built1 }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      upload-package: true

  guide-leaf-2:
    name: Guides
    needs: [guide-plan, guide-trunk-1]
    uses: ./.github/workflows/build-guide-wave.yml
    with:
      guides: ${{ needs.guide-plan.outputs.leaf2 }}
      built: ${{ needs.guide-plan.outputs.built1 }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  guide-trunk-3:
    name: Guides
    needs: [guide-plan, guide-trunk-2]
    uses: ./.github/workflows/build-guide-wave.yml
    with:
      guides: ${{ needs.guide-plan.outputs.trunk3 }}
      built: ${{ needs.guide-plan.outputs.built2 }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      upload-package: true

  guide-leaf-3:
    name: Guides
    needs: [guide-plan, guide-trunk-2]
    uses: ./.github/workflows/build-guide-wave.yml
    with:
      guides: ${{ needs.guide-plan.outputs.leaf3 }}
      built: ${{ needs.guide-plan.outputs.built2 }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  guide-trunk-4:
    name: Guides
    needs: [guide-plan, guide-trunk-3]
    uses: ./.github/workflows/build-guide-wave.yml
    with:
      guides: ${{ needs.guide-plan.outputs.trunk4 }}
      built: ${{ needs.guide-plan.outputs.built3 }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      upload-package: true

  guide-leaf-4:
    name: Guides
    needs: [guide-plan, guide-trunk-3]
    uses: ./.github/workflows/build-guide-wave.yml
    with:
      guides: ${{ needs.guide-plan.outputs.leaf4 }}
      built: ${{ needs.guide-plan.outputs.built3 }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  guide-trunk-5:
    name: Guides
    needs: [guide-plan, guide-trunk-4]
    uses: ./.github/workflows/build-guide-wave.yml
    with:
      guides: ${{ needs.guide-plan.outputs.trunk5 }}
      built: ${{ needs.guide-plan.outputs.built4 }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      upload-package: true

  guide-leaf-5:
    name: Guides
    needs: [guide-plan, guide-trunk-4]
    uses: ./.github/workflows/build-guide-wave.yml
    with:
      guides: ${{ needs.guide-plan.outputs.leaf5 }}
      built: ${{ needs.guide-plan.outputs.built4 }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  guide-leaf-6:
    name: Guides
    needs: [guide-plan, guide-trunk-5]
    uses: ./.github/workflows/build-guide-wave.yml
    with:
      guides: ${{ needs.guide-plan.outputs.leaf6 }}
      built: ${{ needs.guide-plan.outputs.built5 }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  release-gate:
    name: Release Gate (Offline Lane)
    # The offline lane is what `deployment.yml` gates a release on, and it is stricter than the
    # per-guide online waves: without a terminology server the Publisher reports findings the
    # online build never sees. Running it here means a release-blocking regression surfaces on the
    # pull request that introduces it rather than months later at release time. It starts at once
    # rather than after the tooling tests: it reads nothing they produce, and it is the longest lane.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.10+7.0.LTS"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: false
      - name: Select the locked Bundler
        run: gem install bundler -v 4.0.16 --no-document
      - uses: actions/cache@v6
        with:
          path: |
            .build/fhir-home
            .build/fhir-tools
            .build/bundle
          key: fhir-guides-${{ runner.os }}-${{ hashFiles('Scripts/download-fhir-tools.sh') }}-${{ hashFiles('Gemfile.lock', 'package-lock.json') }}
          restore-keys: |
            fhir-guides-${{ runner.os }}-${{ hashFiles('Scripts/download-fhir-tools.sh') }}-
      - name: Bootstrap the checksum-pinned dependency closure online
        run: |
          npm ci
          bundle config set --local path "$GITHUB_WORKSPACE/.build/bundle"
          bundle config set --local bin "$GITHUB_WORKSPACE/.build/bin"
          bundle install --jobs 4 --retry 3
          ./Scripts/download-fhir-tools.sh "$GITHUB_WORKSPACE/.build/fhir-tools"
      - name: Replay the verified closure and build in the offline lane
        # Below the job's 60 minutes: a hung build then fails this step, rather than cancelling the
        # job, so the upload below still collects the per-guide logs.
        timeout-minutes: 50
        env:
          GROVE_TX_OFFLINE: "1"
          NPM_CONFIG_OFFLINE: "true"
        run: |
          npm ci --offline
          bundle check
          ./Scripts/download-fhir-tools.sh --offline "$GITHUB_WORKSPACE/.build/fhir-tools"
          npm run pages:build:parallel
      # The QA ledger is what the gate reads; without it a failure names a count and nothing else.
      - name: Upload the QA ledgers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-lane-qa
          if-no-files-found: warn
          retention-days: 7
          # The per-guide build logs live under the hidden .build/ directory.
          include-hidden-files: true
          path: |
            */output/qa.html
            */output/qa.json
            */output/package.tgz
            */fsh-generated/resources/ImplementationGuide-*.json
            .build/parallel-homes/*.log

  guides:
    name: Build and Validate All R4 Guides
    # Every trunk and leaf job, including one the plan left empty: a skipped job still has to be
    # accounted for rather than letting the ledger run against a partial set. The tooling tests and
    # the plan no longer gate the guide builds, so they are required here instead.
    needs:
      - tooling
      - guide-plan
      - guide-trunk-1
      - guide-leaf-1
      - guide-trunk-2
      - guide-leaf-2
      - guide-trunk-3
      - guide-leaf-3
      - guide-trunk-4
      - guide-leaf-4
      - guide-trunk-5
      - guide-leaf-5
      - guide-leaf-6
    # Runs even when a full-build wave fails, so this required check fails rather than hiding a
    # partial build. Draft pull requests use `draft-guides` instead; all full-build waves are
    # intentionally skipped there, so the aggregate must be skipped with them.
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require every wave to have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::the tooling tests, the plan, or a guide wave did not succeed; the ledger cannot audit a partial build"
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.10+7.0.LTS"
      - uses: actions/cache@v6
        with:
          path: |
            .build/fhir-home
            .build/fhir-tools
            .build/bundle
          key: fhir-guides-${{ runner.os }}-${{ hashFiles('Scripts/download-fhir-tools.sh') }}-${{ hashFiles('Gemfile.lock', 'package-lock.json') }}
          restore-keys: |
            fhir-guides-${{ runner.os }}-${{ hashFiles('Scripts/download-fhir-tools.sh') }}-
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: guide-output-*
          path: .build/restored
      - name: Restore every built guide
        run: |
          for guide in $(python3 Scripts/guide-build-plan.py | tr '\n' ' '); do
            test -d ".build/restored/guide-output-$guide"
            mkdir -p "$guide/output"
            cp -R ".build/restored/guide-output-$guide/." "$guide/output/"
          done
      - name: Audit the QA ledger of every guide
        run: |
          python3 Scripts/guide-build-plan.py | tr '\n' ' ' \
            | xargs python3 Scripts/check-guide-qa.py
      - run: ./Scripts/assemble-pages.sh
      - run: python3 -m unittest Tests.test_artifact_allowlist -v
      # Skips without a build, so it cannot run in the tooling job that has none.
      - run: >-
          python3 -m unittest -v
          Tests.test_questionnaire_contract.QuestionnaireContractTests.test_published_pairs_validate_against_their_own_instrument
      - run: python3 Scripts/validate-questionnaire-fhir.py
      - name: Validate the example producer with the official Validator
        run: >-
          python3 Scripts/validate-producer.py
          --manifest Conformance/corpora/mobile-exchange/official-validator-manifest.json
          --validator .build/fhir-tools/validator_cli.jar
          --package mobile=mobile/output/package.tgz
          --package questionnaire=questionnaire/output/package.tgz
          --allow-example-urls
      - name: Validate every committed fixture with the official Validator
        run: >-
          python3 Scripts/validate-fixtures.py
          --validator .build/fhir-tools/validator_cli.jar
          --package mobile=mobile/output/package.tgz
          --package questionnaire=questionnaire/output/package.tgz
          --package sensor=sensor/output/package.tgz
          --package healthkit=healthkit/output/package.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: pages-site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: .build/pages
