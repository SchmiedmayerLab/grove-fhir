name: Build and Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling:
    name: Repository and Tooling Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Run repository and tooling tests
        run: npm test
      - name: Reject whitespace errors
        run: git diff --check

  integration-sources:
    name: Integration Proposal Sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify immutable external source pins
        run: python3 Scripts/check-integration-sources.py

  integration-proposals:
    name: Integration Proposal Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Verify immutable proposal sources
        run: python3 Scripts/check-integration-sources.py
      - name: Apply and test external change proposals
        run: >-
          python3 Scripts/validate-integration-proposals.py
          --platform linux
          --test-group portable
      - name: Test the exact Android Health Connect proposal
        run: >-
          python3 Scripts/validate-integration-proposals.py
          --platform linux
          --test-group android-contract
          --proposal my-heart-counts-android-health-connect
      - name: Install the exact Firebase CLI
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
        run: npm install --global firebase-tools@15.27.0
      - name: Test the exact Firebase receiver proposal
        env:
          CI: "true"
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
        run: >-
          python3 Scripts/validate-integration-proposals.py
          --platform linux
          --test-group firebase-contract
          --proposal my-heart-counts-firebase-fhir-receiver

  guides:
    name: Build All Implementation Guides
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.fhir
            .build/fhir-tools
            .build/bundle
            mobile/input-cache
            healthkit/input-cache
            health-connect/input-cache
            questionnaire/input-cache
          key: fhir-guides-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'package-lock.json', 'Scripts/download-fhir-tools.sh') }}
          restore-keys: |
            fhir-guides-${{ runner.os }}-
      - run: npm ci
      - name: Build all implementation guides
        run: npm run build
      - name: Verify the published artifact allowlist
        run: python3 -m unittest Tests.test_artifact_allowlist -v
      - name: Validate the Questionnaire fixture corpus
        run: python3 Scripts/validate-questionnaire-fhir.py
      - name: Verify the immutable Android proposal source
        run: python3 Scripts/check-integration-sources.py
      - name: Validate Android-emitted resources against the exact guides
        env:
          FHIR_VALIDATOR_JAR: ${{ github.workspace }}/.build/fhir-tools/validator_cli.jar
          GROVE_MOBILE_PACKAGE: ${{ github.workspace }}/mobile/output/package.tgz
          GROVE_HEALTH_CONNECT_PACKAGE: ${{ github.workspace }}/health-connect/output/package.tgz
          GROVE_CONFORMANCE_EXPORT: ${{ github.workspace }}/.build/health-connect-conformance-fixtures
        run: >-
          python3 Scripts/validate-integration-proposals.py
          --platform linux
          --test-group android-emitted-resource-conformance
          --proposal my-heart-counts-android-health-connect
      - name: Assemble the sanitized preview artifact
        run: ./Scripts/assemble-pages.sh
      - name: Summarize publisher QA
        if: always()
        run: python3 Scripts/check-guide-qa.py --summary mobile healthkit health-connect questionnaire
      - name: Upload rendered guides and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-guides
          if-no-files-found: error
          retention-days: 14
          path: .build/pages

  vocabulary-is-current:
    name: Platform Vocabulary Matches Grove
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          path: grove-fhir
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify the immutable Grove proposal source
        working-directory: grove-fhir
        run: python3 Scripts/check-integration-sources.py
      - name: Test the exact Grove Questionnaire and Mobile contract proposals
        working-directory: grove-fhir
        run: >-
          python3 Scripts/validate-integration-proposals.py
          --platform macos
          --test-group macos-contract
          --proposal grove-mobile-contract
      - name: Freeze the exact Grove 0.2.1 HealthKit writer bytes
        working-directory: grove-fhir
        env:
          GROVE_COMPATIBILITY_EXPORT: ${{ runner.temp }}/grove-0.2.1-healthkit-sample.json
        run: >-
          python3 Scripts/validate-integration-proposals.py
          --platform macos
          --test-group legacy-writer-evidence
          --proposal grove-legacy-021-healthkit-writer-fixture
      - name: Test the current Grove reader against the exact legacy bytes
        working-directory: grove-fhir
        env:
          GROVE_COMPATIBILITY_EXPORT: ${{ runner.temp }}/grove-0.2.1-healthkit-sample.json
        run: >-
          python3 Scripts/validate-integration-proposals.py
          --platform macos
          --test-group current-reader-evidence
          --proposal grove-current-legacy-healthkit-reader
      - name: Freeze the exact My Heart Counts iOS legacy-candidate writer bytes
        working-directory: grove-fhir
        env:
          MHC_COMPATIBILITY_EXPORT: ${{ runner.temp }}/mhc-ios-e7ae-compatibility
        run: >-
          python3 Scripts/validate-integration-proposals.py
          --platform macos
          --test-group mhc-ios-writer-evidence
          --proposal my-heart-counts-ios-study-enrollment-writer-fixture

  emitted-resource-conformance:
    name: Grove Output Conforms to the Guides
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          path: grove-fhir
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grove-fhir/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.fhir
            grove-fhir/.build/fhir-tools
            grove-fhir/.build/bundle
            grove-fhir/mobile/input-cache
            grove-fhir/healthkit/input-cache
            grove-fhir/questionnaire/input-cache
          key: >-
            fhir-guides-${{ runner.os }}-${{
              hashFiles(
                'grove-fhir/Gemfile.lock',
                'grove-fhir/package-lock.json',
                'grove-fhir/Scripts/download-fhir-tools.sh'
              )
            }}
          restore-keys: |
            fhir-guides-${{ runner.os }}-
      - name: Verify the immutable Grove proposal source
        working-directory: grove-fhir
        run: python3 Scripts/check-integration-sources.py
      - name: Build the exact Mobile, HealthKit, and Questionnaire packages
        working-directory: grove-fhir
        run: |
          npm ci
          ./Scripts/build-guides.sh mobile healthkit questionnaire
      - name: Validate deterministic resources from the exact Grove proposals
        working-directory: grove-fhir
        env:
          FHIR_VALIDATOR: ${{ github.workspace }}/grove-fhir/.build/fhir-tools/validator_cli.jar
          GROVE_IG_MOBILE: ${{ github.workspace }}/grove-fhir/mobile/output/package.tgz
          GROVE_IG_HEALTHKIT: ${{ github.workspace }}/grove-fhir/healthkit/output/package.tgz
          GROVE_IG_QUESTIONNAIRE: ${{ github.workspace }}/grove-fhir/questionnaire/output/package.tgz
          GROVE_CONFORMANCE_EXPORT: ${{ github.workspace }}/grove-fhir/.build/grove-conformance-fixtures
        run: >-
          python3 Scripts/validate-integration-proposals.py
          --platform macos
          --test-group emitted-resource-conformance
          --proposal grove-mobile-contract
      - name: Upload emitted fixtures and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grove-conformance-fixtures
          if-no-files-found: error
          retention-days: 14
          path: grove-fhir/.build/grove-conformance-fixtures
