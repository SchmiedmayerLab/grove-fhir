name: Build and Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling:
    name: Repository and Tooling Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run repository and tooling tests
        run: npm test
      - name: Reject whitespace errors
        run: git diff --check

  guides:
    name: Build All Implementation Guides
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.fhir
            .build/fhir-tools
            .build/bundle
            ig/input-cache
            platforms/input-cache
          key: fhir-guides-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'package-lock.json', 'Scripts/download-fhir-tools.sh') }}
          restore-keys: |
            fhir-guides-${{ runner.os }}-
      - run: npm ci
      - name: Build platform and core guides
        run: npm run build
      - name: Summarize publisher QA
        if: always()
        run: python3 Scripts/check-guide-qa.py --summary platforms ig
      - name: Upload rendered guides and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-guides
          if-no-files-found: error
          retention-days: 14
          path: |
            platforms/output
            ig/output

  vocabulary-is-current:
    name: Platform Vocabulary Matches Grove
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: grove-fhir
      - uses: actions/checkout@v7
        with:
          repository: SchmiedmayerLab/Grove
          ref: 6fe6b681a1576c4805b7bfe2408789cb7757612b
          path: grove
      - name: Dump the vocabulary Grove writes
        working-directory: grove
        run: ./Scripts/run-package-tests.sh GroveHealthKitFHIR macOS
      - name: Regenerate the platform vocabulary
        working-directory: grove-fhir
        run: |
          python3 tools/generate-platform-vocabulary.py \
            --grove ../grove --dump ../grove/.build/grove-vocabulary.json
      - name: Reject vocabulary drift
        working-directory: grove-fhir
        run: git diff --exit-code -- platforms/input

  emitted-resource-conformance:
    name: Grove Output Conforms to the Guides
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          path: grove-fhir
      - uses: actions/checkout@v7
        with:
          repository: SchmiedmayerLab/Grove
          ref: 6fe6b681a1576c4805b7bfe2408789cb7757612b
          path: grove
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grove-fhir/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - name: Install and build both active guide packages
        working-directory: grove-fhir
        run: |
          npm ci
          ./Scripts/build-guides.sh platforms ig
      - name: Emit Mobile Data Exchange fixtures from Grove
        working-directory: grove
        run: |
          rm -rf .build/conformance-fixtures
          ./Scripts/run-package-tests.sh GroveHealthKitFHIR macOS
      - name: Validate Mobile Data Exchange fixtures
        working-directory: grove
        run: |
          fixtures=(
            .build/conformance-fixtures/heart-rate.json
            .build/conformance-fixtures/step-count.json
            .build/conformance-fixtures/sleep-analysis.json
            .build/conformance-fixtures/state-of-mind.json
          )
          for fixture in "${fixtures[@]}"; do
            test -f "$fixture"
          done
          java -jar ../grove-fhir/.build/fhir-tools/validator_cli.jar \
            -version 4.0.1 \
            -ig "$HOME/.fhir/packages/org.grovealliance.fhir.core#0.6.0-preview.1" \
            -ig "$HOME/.fhir/packages/org.grovealliance.fhir.platforms#0.2.0-preview.1" \
            "${fixtures[@]}" 2>&1 | tee .build/conformance-fixtures/validation.txt
          if grep -q '\*FAILURE\*' .build/conformance-fixtures/validation.txt; then
            exit 1
          fi
      - name: Upload emitted fixtures and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grove-conformance-fixtures
          if-no-files-found: warn
          retention-days: 14
          path: grove/.build/conformance-fixtures
