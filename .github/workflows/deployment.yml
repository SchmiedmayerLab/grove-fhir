name: Release Publication

on:
  # Release publication is deliberate. Main pushes only deploy the development preview.
  # A signed annotated tag must already identify the reviewed source before publication.
  workflow_dispatch:
    inputs:
      version:
        description: Bare semantic version to release. It must equal the release manifest and every guide.
        required: true
        type: string
      dryRun:
        description: Build and verify the release without publishing a GitHub release.
        required: false
        type: boolean
        default: true

concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the R4 Guides
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BUNDLE_FROZEN: "true"
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_revision: ${{ steps.release.outputs.source_revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the version being released
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases must be dispatched from the default branch ($DEFAULT_BRANCH), not $GITHUB_REF."
            exit 1
          fi
          version="$DISPATCH_VERSION"
          if [ -z "$version" ]; then
            echo "::error::No version was supplied."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refuse a version the guides do not declare
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a bare semantic version."
            exit 1
          fi
          # Every guide ships one version. A release that disagrees with the sources would publish
          # packages whose own metadata contradicts the tag.
          mismatched=0
          while IFS= read -r configuration; do
            declared="$(awk -F': *' '/^version:/{gsub(/"/,"",$2); print $2; exit}' "$configuration")"
            if [ "$declared" != "$VERSION" ]; then
              echo "::error::$configuration declares $declared, not $VERSION."
              mismatched=1
            fi
          done < <(find . -mindepth 2 -maxdepth 2 -name sushi-config.yaml | sort)
          [ "$mismatched" -eq 0 ]
          manifest_version="$(python3 -c 'import json; print(json.load(open("catalog/release-manifest.json"))["releaseVersion"])')"
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "::error::Release manifest declares $manifest_version, not $VERSION."
            exit 1
          fi
      - name: Require the reviewed signed tag for a real release
        if: ${{ !inputs.dryRun }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION")"
          test "$(jq -r '.object.type' <<< "$ref")" = tag
          tag="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r '.object.sha' <<< "$ref")")"
          test "$(jq -r '.verification.verified' <<< "$tag")" = true
          test "$(jq -r '.object.type' <<< "$tag")" = commit
          test "$(jq -r '.object.sha' <<< "$tag")" = "$SOURCE_REVISION"
          test "$(jq -r '.tagger.email' <<< "$tag")" = PSchmiedmayer@users.noreply.github.com
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "ruby"
          bundler-cache: false
          bundler: latest
      - uses: actions/cache@v6
        with:
          path: |
            .build/fhir-home
            .build/fhir-tools
            .build/bundle
          key: fhir-guides-${{ runner.os }}-${{ hashFiles('Scripts/download-fhir-tools.sh') }}-${{ hashFiles('Gemfile.lock', 'package-lock.json') }}
      - name: Bootstrap the checksum-pinned dependency closure online
        run: |
          npm ci
          bundle config set --local path "$GITHUB_WORKSPACE/.build/bundle"
          bundle config set --local bin "$GITHUB_WORKSPACE/.build/bin"
          bundle install --jobs 4 --retry 3
          ./Scripts/download-fhir-tools.sh "$GITHUB_WORKSPACE/.build/fhir-tools"
      - name: Replay the verified closure and build in the offline lane
        env:
          GROVE_TX_OFFLINE: "1"
          NPM_CONFIG_OFFLINE: "true"
        run: |
          npm ci --offline
          bundle check
          ./Scripts/download-fhir-tools.sh --offline "$GITHUB_WORKSPACE/.build/fhir-tools"
          # The same wave-parallel build as the Release Gate in build-and-test.yml, so the gate a pull
          # request passes is the build a release runs.
          npm run pages:build:parallel
      - name: Verify the repository and tooling contract
        run: npm test
      - name: Verify the normative corpora with the official FHIR Validator
        run: |
          python3 Scripts/validate-questionnaire-fhir.py
          python3 Scripts/validate-producer.py \
            --manifest Conformance/corpora/mobile-exchange/official-validator-manifest.json \
            --validator .build/fhir-tools/validator_cli.jar \
            --package mobile=mobile/output/package.tgz \
            --package questionnaire=questionnaire/output/package.tgz \
            --allow-example-urls
          python3 Scripts/validate-fixtures.py \
            --validator .build/fhir-tools/validator_cli.jar \
            --package mobile=mobile/output/package.tgz \
            --package questionnaire=questionnaire/output/package.tgz \
            --package sensor=sensor/output/package.tgz \
            --package healthkit=healthkit/output/package.tgz
      - name: Verify the assembled site
        run: >-
          python3 Scripts/check-publication.py
          --site .build/pages
          --repository-root .
          --config publication/config.json
          --base-url https://schmiedmayerlab.github.io/grove-fhir
      - name: Collect checksum-bound release-candidate evidence
        env:
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
        run: |
          python3 Scripts/collect-release-evidence.py \
            --output .build/release \
            --source-revision "$SOURCE_REVISION" \
            --lane offline-structural
          (cd .build/release && sha256sum --check SHA256SUMS)
          ls -la .build/release
      - name: Stage versioned guides with the standard FHIR publication tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Scripts/stage-publication.py --evidence .build/release --output .build/publication-release --date "$(date -u +%F)"
          (cd .build/publication-release && sha256sum --check SHA256SUMS)
      - name: Retain publication artifacts for review
        if: inputs.dryRun
        uses: actions/upload-artifact@v7
        with:
          name: grove-fhir-${{ steps.release.outputs.version }}-publication-review
          path: .build/publication-release/
          if-no-files-found: error
          retention-days: 14
      - name: Report a dry run
        if: inputs.dryRun
        run: echo "Dry run verified ${{ steps.release.outputs.version }} without publishing a GitHub release."
      - name: Transfer verified evidence to the isolated publication job
        if: ${{ !inputs.dryRun }}
        uses: actions/upload-artifact@v7
        with:
          name: grove-fhir-${{ steps.release.outputs.version }}-evidence
          path: .build/publication-release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Create the GitHub Release
    if: ${{ !inputs.dryRun }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: fhir-release
    permissions:
      actions: read
      contents: write
    steps:
      # This job never checks out or executes repository code. Its write token is available only
      # after the read-only verification job has completed successfully.
      - name: Retrieve verified release evidence
        uses: actions/download-artifact@v8
        with:
          name: grove-fhir-${{ needs.verify.outputs.version }}-evidence
          path: .build/publication-release
      - name: Recheck transferred evidence
        run: (cd .build/publication-release && sha256sum --check SHA256SUMS)
      - name: Recheck the signed tag before publication
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_REVISION: ${{ needs.verify.outputs.source_revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION")"
          test "$(jq -r '.object.type' <<< "$ref")" = tag
          tag="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r '.object.sha' <<< "$ref")")"
          test "$(jq -r '.verification.verified' <<< "$tag")" = true
          test "$(jq -r '.object.type' <<< "$tag")" = commit
          test "$(jq -r '.object.sha' <<< "$tag")" = "$SOURCE_REVISION"
          test "$(jq -r '.tagger.email' <<< "$tag")" = PSchmiedmayer@users.noreply.github.com
      - name: Publish the release and its packages
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # --verify-tag consumes the existing signed tag checked against the verified source.
          # Assets are uploaded while the release is a draft. A failed upload therefore cannot
          # expose a partial release; only the final edit makes the complete draft public.
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes \
            --draft \
            .build/publication-release/*
          gh release edit "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
      - name: Report the publication artifact
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          echo "Published grove-fhir-publication-$VERSION.tar.gz for the website to mount under /fhir/." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow does not deploy or change the canonical website." >> "$GITHUB_STEP_SUMMARY"

  notify-website:
    name: Notify the website of the published release
    needs: [verify, publish]
    if: vars.GROVE_WEBSITE_APP_ID != ''
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.GROVE_WEBSITE_APP_ID }}
          private-key: ${{ secrets.GROVE_WEBSITE_APP_PRIVATE_KEY }}
          owner: SchmiedmayerLab
          repositories: grove-website
          permission-actions: write
      - name: Dispatch the website deployment
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh workflow run pages.yml --repo SchmiedmayerLab/grove-website --ref main -f "releaseTag=$VERSION"
