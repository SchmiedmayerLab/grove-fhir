name: Deployment

on:
  # A release can only be created at the end of this workflow. In particular, an already-public
  # release is never treated as input to a validation job.
  workflow_dispatch:
    inputs:
      version:
        description: Bare semantic version to release. It must equal the release manifest and every guide.
        required: true
        type: string
      dryRun:
        description: Build and verify the release without creating a tag or a GitHub release.
        required: false
        type: boolean
        default: false

concurrency:
  group: deployment-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the R4 Guides
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUNDLE_FROZEN: "true"
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_revision: ${{ steps.release.outputs.source_revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the version being released
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases must be dispatched from the default branch ($DEFAULT_BRANCH), not $GITHUB_REF."
            exit 1
          fi
          version="$DISPATCH_VERSION"
          if [ -z "$version" ]; then
            echo "::error::No version was supplied."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refuse a version the guides do not declare
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::'$VERSION' is not a bare semantic version."
            exit 1
          fi
          # Every guide ships one version. A release that disagrees with the sources would publish
          # packages whose own metadata contradicts the tag.
          mismatched=0
          while IFS= read -r configuration; do
            declared="$(awk -F': *' '/^version:/{gsub(/"/,"",$2); print $2; exit}' "$configuration")"
            if [ "$declared" != "$VERSION" ]; then
              echo "::error::$configuration declares $declared, not $VERSION."
              mismatched=1
            fi
          done < <(find . -mindepth 2 -maxdepth 2 -name sushi-config.yaml | sort)
          [ "$mismatched" -eq 0 ]
          manifest_version="$(python3 -c 'import json; print(json.load(open("catalog/release-manifest.json"))["releaseVersion"])')"
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "::error::Release manifest declares $manifest_version, not $VERSION."
            exit 1
          fi
      - name: Refuse a tag that already exists
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists; a published version is never rewritten."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.10+7.0.LTS"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: false
      - name: Select the locked Bundler
        run: gem install bundler -v 4.0.16 --no-document
      - uses: actions/cache@v6
        with:
          path: |
            .build/fhir-home
            .build/fhir-tools
            .build/bundle
          key: fhir-guides-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'package-lock.json', 'Scripts/download-fhir-tools.sh') }}
      - name: Bootstrap the checksum-pinned dependency closure online
        run: |
          npm ci
          bundle config set --local path "$GITHUB_WORKSPACE/.build/bundle"
          bundle config set --local bin "$GITHUB_WORKSPACE/.build/bin"
          bundle install --jobs 4 --retry 3
          ./Scripts/download-fhir-tools.sh "$GITHUB_WORKSPACE/.build/fhir-tools"
      - name: Replay the verified closure and build in the offline lane
        env:
          GROVE_TX_OFFLINE: "1"
          NPM_CONFIG_OFFLINE: "true"
        run: |
          npm ci --offline
          bundle check
          ./Scripts/download-fhir-tools.sh --offline "$GITHUB_WORKSPACE/.build/fhir-tools"
          npm run pages:build
      - name: Verify the repository and tooling contract
        run: npm test
      - name: Verify the normative corpora with the official FHIR Validator
        run: |
          python3 Scripts/validate-questionnaire-fhir.py
          python3 Scripts/validate-producer.py \
            --manifest Conformance/corpora/mobile-exchange/official-validator-manifest.json \
            --validator .build/fhir-tools/validator_cli.jar \
            --package mobile=mobile/output/package.tgz \
            --allow-example-urls
      - name: Verify the assembled site
        run: >-
          python3 Scripts/check-publication.py
          --site .build/pages
          --repository-root .
          --config publication/config.json
          --base-url https://schmiedmayerlab.github.io/grove-fhir
      - name: Collect checksum-bound release-candidate evidence
        env:
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
        run: |
          python3 Scripts/collect-release-evidence.py \
            --output .build/release \
            --source-revision "$SOURCE_REVISION" \
            --lane offline-structural
          (cd .build/release && sha256sum --check SHA256SUMS)
          ls -la .build/release
      - name: Report a dry run
        if: inputs.dryRun
        run: echo "Dry run verified ${{ steps.release.outputs.version }} without tagging or releasing."
      - name: Transfer verified evidence to the isolated publication job
        if: ${{ !inputs.dryRun }}
        uses: actions/upload-artifact@v7
        with:
          name: grove-fhir-${{ steps.release.outputs.version }}-evidence
          path: .build/release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Create the GitHub Release
    if: ${{ !inputs.dryRun }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      # This job never checks out or executes repository code. Its write token is available only
      # after the read-only verification job has completed successfully.
      - name: Retrieve verified release evidence
        uses: actions/download-artifact@v8
        with:
          name: grove-fhir-${{ needs.verify.outputs.version }}-evidence
          path: .build/release
      - name: Recheck transferred evidence
        run: (cd .build/release && sha256sum --check SHA256SUMS)
      - name: Create the immutable release tag at the verified source
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_REVISION: ${{ needs.verify.outputs.source_revision }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/git/refs"
          -f "ref=refs/tags/$VERSION"
          -f "sha=$SOURCE_REVISION"
      - name: Publish the release and its packages
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # --verify-tag makes the public release consume only the exact ref created above.
          # Assets are uploaded while the release is a draft. A failed upload therefore cannot
          # expose a partial release; only the final edit makes the complete draft public.
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes \
            --draft \
            .build/release/*
          gh release edit "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
      - name: Report where the guides are published
        run: |
          {
            echo "### Grove FHIR ${{ needs.verify.outputs.version }}"
            echo
            echo "Guides: https://schmiedmayerlab.github.io/grove-fhir/"
            echo
            echo "This attaches checksum-bound packages, Publisher QA, semantic snapshot, release"
            echo "manifest, and source/toolchain provenance. It does not claim canonical publication."
            echo "The canonical host is not served yet; immutable canonical promotion remains gated"
            echo "behind publication/config.json plus live-host and governance approval."
          } >> "$GITHUB_STEP_SUMMARY"
