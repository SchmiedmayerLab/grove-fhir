name: Deployment

on:
  # Two paths, one job. Publishing a release from the UI creates the tag first and this run
  # attaches the verified packages to it. Dispatching by version verifies everything before any
  # tag exists, so a failed build leaves nothing behind to delete.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Bare semantic version to release, for example 0.3.0. It must equal the version every guide declares.
        required: true
        type: string
      dryRun:
        description: Build and verify the release without creating a tag or a GitHub release.
        required: false
        type: boolean
        default: false

concurrency:
  group: deployment-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish the R4 Guides
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the version being released
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${DISPATCH_VERSION:-$RELEASE_TAG}"
          if [ -z "$version" ]; then
            echo "::error::No version was supplied."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A release published from the UI already owns its tag, so this run only attaches to it.
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "owns-tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "owns-tag=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse a version the guides do not declare
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::'$VERSION' is not a bare semantic version."
            exit 1
          fi
          # Every guide ships one version. A release that disagrees with the sources would publish
          # packages whose own metadata contradicts the tag.
          mismatched=0
          while IFS= read -r configuration; do
            declared="$(python3 -c "import sys,yaml;print(yaml.safe_load(open(sys.argv[1]))['version'])" "$configuration")"
            if [ "$declared" != "$VERSION" ]; then
              echo "::error::$configuration declares $declared, not $VERSION."
              mismatched=1
            fi
          done < <(find . -mindepth 2 -maxdepth 2 -name sushi-config.yaml | sort)
          [ "$mismatched" -eq 0 ]
      - name: Refuse a tag that already exists
        if: steps.release.outputs.owns-tag == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists; a published version is never rewritten."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.10+7.0.LTS"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: false
      - name: Select the locked Bundler
        run: gem install bundler -v 4.0.16 --no-document
      - uses: actions/cache@v5
        with:
          path: |
            .build/fhir-home
            .build/fhir-tools
            .build/bundle
          key: fhir-guides-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'package-lock.json', 'Scripts/download-fhir-tools.sh') }}
          restore-keys: |
            fhir-guides-${{ runner.os }}-
      - run: npm ci
      - name: Build and assemble every guide
        run: npm run pages:build
      - name: Verify the repository and tooling contract
        run: npm test
      - name: Verify the assembled site
        run: >-
          python3 Scripts/check-publication.py
          --site .build/pages
          --repository-root .
          --config publication/config.json
          --base-url https://schmiedmayerlab.github.io/grove-fhir
      - name: Collect the published packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p .build/release
          while IFS= read -r configuration; do
            guide="$(dirname "$configuration")"
            guide="${guide#./}"
            package="$guide/output/package.tgz"
            if [ ! -f "$package" ]; then
              echo "::error::$guide produced no package.tgz."
              exit 1
            fi
            identifier="$(python3 -c "import sys,yaml;print(yaml.safe_load(open(sys.argv[1]))['id'])" "$configuration")"
            cp "$package" ".build/release/$identifier-$VERSION.tgz"
          done < <(find . -mindepth 2 -maxdepth 2 -name sushi-config.yaml | sort)
          ls -la .build/release
      - name: Report a dry run
        if: inputs.dryRun
        run: echo "Dry run verified ${{ steps.release.outputs.version }} without tagging or releasing."
      - name: Publish the release and its packages
        if: ${{ !inputs.dryRun }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          OWNS_TAG: ${{ steps.release.outputs.owns-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$OWNS_TAG" = "true" ]; then
            # --target creates the tag together with the release, so a failure here leaves no
            # orphan tag behind and the version stays free to retry.
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --generate-notes \
              --latest \
              .build/release/*.tgz
          else
            # The release already exists and owns its tag; attach the verified packages to it.
            gh release upload "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              .build/release/*.tgz
          fi
      - name: Report where the guides are published
        if: ${{ !inputs.dryRun }}
        run: |
          {
            echo "### Grove FHIR ${{ steps.release.outputs.version }}"
            echo
            echo "Guides: https://schmiedmayerlab.github.io/grove-fhir/"
            echo
            echo "The canonical host is not served yet, so this release publishes the browsable"
            echo "guides to GitHub Pages and attaches every FHIR package to the release. The"
            echo "canonical immutable publication stays gated behind publication/config.json."
          } >> "$GITHUB_STEP_SUMMARY"
