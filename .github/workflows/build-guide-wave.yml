name: Build One Guide Wave

# One wave of the guide build: either its trunk (the guides other guides depend on) or its leaves.
# Every guide here is independent of the others, so each gets its own runner; it starts only once the
# trunk of the wave before has finished, because a guide reads the built package of every guide it
# depends on, and every such guide is a trunk guide of an earlier wave.
#
# The caller passes the guides and the trunk guides already built. Nothing here names a guide, so
# adding one changes only Scripts/guide-build-plan.py.
on:
  workflow_call:
    inputs:
      guides:
        description: The guides to build concurrently, as a JSON array.
        required: true
        type: string
      built:
        description: The trunk guides earlier waves built, as a JSON array; their packages are restored.
        required: true
        type: string
      upload-package:
        description: Publish each guide's package for later waves, which only trunk guides need.
        required: false
        type: boolean
        default: false
      ref:
        description: The commit to build.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    # An empty wave has nothing to build, and a matrix over an empty list is an error.
    if: inputs.guides != '[]'
    name: ${{ matrix.guide }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        guide: ${{ fromJSON(inputs.guides) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.10+7.0.LTS"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: false
      - name: Select the locked Bundler
        run: gem install bundler -v 4.0.16 --no-document
      - uses: actions/cache@v6
        with:
          path: |
            .build/fhir-home
            .build/fhir-tools
            .build/bundle
          key: fhir-guides-${{ runner.os }}-${{ hashFiles('Scripts/download-fhir-tools.sh') }}-${{ hashFiles('Gemfile.lock', 'package-lock.json') }}
          restore-keys: |
            fhir-guides-${{ runner.os }}-${{ hashFiles('Scripts/download-fhir-tools.sh') }}-
      - run: npm ci
      # A dependent guide reads only each dependency's package.tgz, so only the packages are
      # restored, and only the ones named in `built`: those come from trunk jobs that have finished,
      # never from a concurrent job that may still be uploading.
      - name: Name the packages earlier waves built
        if: inputs.built != '[]'
        id: built
        env:
          BUILT: ${{ inputs.built }}
        run: |
          python3 - <<'PATTERN' >> "$GITHUB_OUTPUT"
          import json, os
          built = json.loads(os.environ["BUILT"])
          # One name stays literal: a brace with no comma is not an alternation.
          names = built[0] if len(built) == 1 else "{" + ",".join(built) + "}"
          print(f"pattern=guide-package-{names}")
          PATTERN
      # Each package artifact holds `<guide>/package.tgz`, and merging keeps that layout whether the
      # pattern matches one artifact or several.
      - uses: actions/download-artifact@v8
        if: inputs.built != '[]'
        with:
          pattern: ${{ steps.built.outputs.pattern }}
          merge-multiple: true
          path: .build/restored-packages
      - name: Restore the packages earlier waves built
        if: inputs.built != '[]'
        env:
          BUILT: ${{ inputs.built }}
        run: |
          for guide in $(printf '%s' "$BUILT" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            test -f ".build/restored-packages/$guide/package.tgz"
            mkdir -p "$guide/output"
            cp ".build/restored-packages/$guide/package.tgz" "$guide/output/package.tgz"
          done
      - name: Build ${{ matrix.guide }}
        run: ./Scripts/build-guides.sh "${{ matrix.guide }}"
      - name: Upload the failed guide's QA ledgers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: guide-qa-${{ matrix.guide }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ matrix.guide }}/output/qa.html
            ${{ matrix.guide }}/output/qa.json
            ${{ matrix.guide }}/output/package.tgz
            ${{ matrix.guide }}/fsh-generated/resources/ImplementationGuide-*.json
      - name: Stage the package later waves build against
        if: inputs.upload-package
        run: |
          mkdir -p ".build/package-artifact/${{ matrix.guide }}"
          cp "${{ matrix.guide }}/output/package.tgz" ".build/package-artifact/${{ matrix.guide }}/package.tgz"
      - uses: actions/upload-artifact@v7
        if: inputs.upload-package
        with:
          name: guide-package-${{ matrix.guide }}
          if-no-files-found: error
          retention-days: 1
          # Already gzip-compressed.
          compression-level: 0
          path: .build/package-artifact
      - uses: actions/upload-artifact@v7
        with:
          name: guide-output-${{ matrix.guide }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: ${{ matrix.guide }}/output
