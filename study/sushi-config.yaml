id: org.grovealliance.fhir.study
canonical: https://grovealliance.org/fhir/study
name: GroveFHIRStudy
title: Grove FHIR Study Exchange
description: >-
  An experimental FHIR R4 contract for exchanging versioned study protocols, the occurrences of
  study components they assign, and the questionnaire responses that complete questionnaire
  occurrences.
status: draft
experimental: true
version: 0.8.2
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
publisher:
  name: Schmiedmayer Lab
  url: https://github.com/SchmiedmayerLab
license: MIT
copyright: >-
  Grove-authored profiles, extensions, terminology, and examples in this guide are published by the Schmiedmayer Lab under the MIT license.

  FHIR® is the registered trademark of HL7 and is used with the permission of HL7. HL7 R4 material is copyright © HL7 International.

dependencies:
  hl7.terminology.r4: 7.5.0
  hl7.fhir.uv.sdc: 4.0.0
  hl7.fhir.uv.extensions.r4: 5.4.0
  org.grovealliance.fhir.questionnaire:
    version: 0.8.2
    uri: https://grovealliance.org/fhir/questionnaire/ImplementationGuide/org.grovealliance.fhir.questionnaire

# Turtle serializations and their rendered views are omitted to keep the published site small.
# JSON and XML remain complete.
parameters:
  excludettl: true

menu:
  Overview: index.html
  Guides: https://grovealliance.org/fhir/mobile/guides.html
  Publish the protocol: protocol.html
  Assign an occurrence: occurrences.html
  Link the result: results.html
  Status: status.html
  Conformance: conformance.html
  Artifacts: artifacts.html

pages:
  index.md:
    title: Overview
  protocol.md:
    title: Publish the protocol
  occurrences.md:
    title: Assign an occurrence
  results.md:
    title: Link the result
  status.md:
    title: Status
  conformance.md:
    title: Conformance
