id: org.grovealliance.fhir.healthkit
canonical: https://grovealliance.org/fhir/healthkit
name: GroveFHIRHealthKit
title: Grove FHIR HealthKit Adapter
description: >-
  FHIR R4 mappings for HealthKit records exchanged through the Grove Mobile contract.
status: draft
version: 0.2.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
publisher:
  name: Schmiedmayer Lab
  url: https://github.com/SchmiedmayerLab
jurisdiction: http://unstats.un.org/unsd/methods/m49/m49.htm#001 "World"
license: MIT

dependencies:
  hl7.terminology.r4: 7.3.0
  org.grovealliance.fhir.mobile:
    version: 0.2.0
    uri: https://grovealliance.org/fhir/mobile/ImplementationGuide/org.grovealliance.fhir.mobile
  # HealthKit instances populate the Mobile profile's standard timezone slice.
  # Declare the exact package so standalone SUSHI consumers resolve that extension.
  hl7.fhir.uv.extensions.r4: 5.3.0

menu:
  Overview: index.html
  Mapping: mapping.html
  Implement and validate: implementation.html
  Artifacts: artifacts.html

pages:
  index.md:
    title: Overview
  mapping.md:
    title: Mapping
  implementation.md:
    title: Implement and validate
  terminology-provenance.md:
    title: Terminology provenance
