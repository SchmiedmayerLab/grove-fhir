  org.grovealliance.fhir.sensor:
    version: 0.6.0
    uri: https://grovealliance.org/fhir/sensor/ImplementationGuide/org.grovealliance.fhir.sensor

# The extension pack ships several versions of data-absent-reason and the guide pins one
# dependency version; pinning the canonical too states which the profile actually means.
parameters:
  pin-canonicals: pin-multiples

