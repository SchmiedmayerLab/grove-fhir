id: org.grovealliance.fhir.core
canonical: https://grovealliance.org/fhir/core
name: GroveFHIRCore
title: Grove FHIR Implementation Guide
description: >-
  FHIR R4 profiles, extensions, terminology, and examples for exchanging mobile health
  observations and questionnaires.
status: draft
version: 0.5.0
fhirVersion: 4.0.1
copyrightYear: 2022+
releaseLabel: ci-build
publisher:
  name: Schmiedmayer Lab
  url: https://github.com/SchmiedmayerLab
jurisdiction: http://unstats.un.org/unsd/methods/m49/m49.htm#001 "World"
license: MIT

dependencies:
  # Pinned, not `dev`: `dev` means "the last local build on this computer", which no one
  # else can resolve. Build platforms/ first and install its package.tgz into the package
  # cache under this version — see README.md.
  org.grovealliance.fhir.platforms:
    version: 0.1.0
    uri: https://grovealliance.org/fhir/platforms/ImplementationGuide/org.grovealliance.fhir.platforms
  hl7.fhir.uv.sdc: 4.0.0
  hl7.fhir.uv.extensions.r4: 5.3.0
  hl7.fhir.uv.phd: 2.0.0

# pin-canonicals disambiguates multi-version matches for extensions-pack canonicals.
parameters:
  pin-canonicals: pin-multiples

menu:
  Overview: index.html
  Mobile Observations: mobile.html
  Questionnaires: questionnaires.html
  Read and Validate: consuming.html

pages:
  index.md:
    title: Overview
  mobile.md:
    title: Mobile Observations
  questionnaires.md:
    title: Questionnaires
  consuming.md:
    title: Read and Validate
