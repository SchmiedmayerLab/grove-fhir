id: org.grovealliance.fhir.providers
canonical: https://grovealliance.org/fhir/providers
name: GroveFHIRProvider
title: Grove FHIR Connected Provider Adapter
description: >-
  FHIR R4 mappings for already-obtained Google Health API, Oura, and Withings data exchanged through Grove source-neutral contracts.
