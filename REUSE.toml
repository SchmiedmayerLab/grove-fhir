version = 1

# These formats cannot safely carry comments without changing their semantics or generated output.
[[annotations]]
path = [
    "LICENSE.md",
    "LICENSES/MIT.txt",
    "Gemfile.lock",
    "Conformance/README.md",
    "Conformance/**/*.json",
    "catalog/*.json",
    "catalog/terminology/*.json",
    "catalog/schemas/*.json",
    "providers/ig.ini",
    "providers/input/ignoreWarnings.txt",
    "health-connect/ig.ini",
    "health-connect/input/ignoreWarnings.txt",
    "healthkit/ig.ini",
    "healthkit/input/data/terminology-provenance.json",
    "mobile/input/data/terminology-reviews.json",
    "*/input/data/*-inventory.json",
    "healthkit/input/ignoreWarnings.txt",
    "mobile/ig.ini",
    "mobile/input/ignoreWarnings.txt",
    "questionnaire/ig.ini",
    "questionnaire/fixtures/**/*.json",
    "questionnaire/input/ignoreWarnings.txt",
    "questionnaire/input/expectedBrokenLinks.txt",
    "sensor/ig.ini",
    "sensor/input/ignoreWarnings.txt",
    "sensorkit/ig.ini",
    "sensorkit/input/ignoreWarnings.txt",
    "withings/ig.ini",
    "withings/input/ignoreWarnings.txt",
    "oura/ig.ini",
    "oura/input/ignoreWarnings.txt",
    "google-health/ig.ini",
    "google-health/input/ignoreWarnings.txt",
    "sensorkit/sushi-config.yaml",
    "package-lock.json",
    "package.json",
    "publication/artifact-allowlist.json",
    "publication/config.json"
]
SPDX-FileCopyrightText = "2026 Schmiedmayer Lab and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"

# The semantic baseline is a snapshot of built package content, including the guides' own
# copyright statements. REUSE would otherwise read those as this file's own copyright and fail
# to parse the JSON that follows them.
[[annotations]]
path = ["publication/mobile-semantic-baseline.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Schmiedmayer Lab and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"
