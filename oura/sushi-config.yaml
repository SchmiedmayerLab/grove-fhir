id: org.grovealliance.fhir.oura
canonical: https://grovealliance.org/fhir/oura
name: GroveFHIROura
title: Grove FHIR Oura Adapter
description: >-
  FHIR R4 mappings for Oura Ring elements that no other source reports, exchanged through Grove
  source-neutral contracts. Shared measurements that two or more connected providers report are
  published by the Grove FHIR Connected Provider Adapter, which this guide depends on.
status: draft
version: 0.5.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
publisher:
  name: Schmiedmayer Lab
  url: https://github.com/SchmiedmayerLab
license: MIT
